name: Android APK

on:
  push:
    branches:
      - android/standalone-apk-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build offline Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build standalone web assets
        run: npm run build
        env:
          VITE_STANDALONE_APP: 'true'

      - name: Generate Android wrapper
        run: npx cap add android

      - name: Copy bundled app into Android project
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: invoice-studio-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
